# Nginx reverse proxy for IlmIldizi. Handles TLS termination, serves static/media files
# directly (faster than routing them through gunicorn), and proxies everything else to
# gunicorn on 127.0.0.1:8000 (see deploy/systemd/ilmildizi.service).
#
# Install:
#   1. Replace YOUR_DOMAIN below with your real domain (e.g. ilmildizi.uz) everywhere.
#   2. cp deploy/nginx/ilmildizi.conf /etc/nginx/sites-available/ilmildizi
#   3. ln -s /etc/nginx/sites-available/ilmildizi /etc/nginx/sites-enabled/
#   4. nginx -t && systemctl reload nginx
#   5. THEN run certbot -- it detects this server_name and automatically adds the
#      HTTPS server block + HTTP->HTTPS redirect for you:
#        apt install certbot python3-certbot-nginx
#        certbot --nginx -d YOUR_DOMAIN
#
# Don't hand-write the SSL cert paths yourself before running certbot -- the certificate
# files don't exist yet, and certbot's --nginx plugin edits this exact file to add them
# (plus auto-renewal) once it has actually issued the certificate.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # Payment screenshot uploads are capped at 5MB in Django (premium/views.py); a little
    # headroom here avoids Nginx rejecting a borderline-sized upload before Django even
    # gets to run its own validation.
    client_max_body_size 10M;

    location /static/ {
        alias /srv/ilmildizi/staticfiles/;
        expires 30d;
        access_log off;
    }

    # Payment screenshots specifically must NOT be served as plain static files -- Django's
    # premium.views.payment_screenshot view gates access (owner/staff only) and re-derives
    # Content-Type from the actual file bytes (see that view's docstring for exactly why:
    # a stored-XSS finding from an earlier security review). This location is matched
    # before the general /media/ rule below, so it wins for this one subpath only.
    location /media/payment_screenshots/ {
        return 404;
    }

    # Everything else under /media/ (avatars, question/lesson images, CKEditor uploads) is
    # public by design -- served directly for speed, same as /static/.
    location /media/ {
        alias /srv/ilmildizi/media/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
