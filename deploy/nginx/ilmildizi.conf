# Nginx reverse proxy for IlmIldizi. Handles TLS termination, serves static/media files
# directly (faster than routing them through the app), and proxies everything else —
# including the Battle Arena WebSocket connections (/ws/battles/...) — to the Daphne
# instances (see deploy/systemd/ilmildizi@.service). The Upgrade/Connection headers
# in the location / block below are what let a WebSocket handshake pass through at all;
# without them Nginx proxies it as a dead plain-HTTP request and the socket never connects.
#
# Install:
#   1. Replace YOUR_DOMAIN below with your real domain (e.g. ilmildizi.uz) everywhere.
#   2. cp deploy/nginx/ilmildizi.conf /etc/nginx/sites-available/ilmildizi
#   3. ln -s /etc/nginx/sites-available/ilmildizi /etc/nginx/sites-enabled/
#   4. nginx -t && systemctl reload nginx
#   5. THEN run certbot -- it detects this server_name and automatically adds the
#      HTTPS server block + HTTP->HTTPS redirect for you:
#        apt install certbot python3-certbot-nginx
#        certbot --nginx -d YOUR_DOMAIN
#
# Don't hand-write the SSL cert paths yourself before running certbot -- the certificate
# files don't exist yet, and certbot's --nginx plugin edits this exact file to add them
# (plus auto-renewal) once it has actually issued the certificate.

# Standard Nginx WebSocket-proxying idiom: browsers always send "Upgrade: websocket" +
# "Connection: Upgrade", but this file must forward "Connection: close" for every plain
# HTTP request too (a hardcoded "Connection: Upgrade" would break normal page loads).
# This `map` must live at the http{} level, not inside server{} — since sites-enabled
# files are included directly into http{}, top-level content here (outside server{})
# already is that level. If you enable a second site on this same box that ALSO defines
# `$connection_upgrade`, move this map into nginx.conf's http{} block instead (nginx
# errors on a duplicate map variable across included files).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Daphne has no internal worker pool — one process is one asyncio event loop, so it's a
# single point of contention under real concurrent traffic. Run one instance per CPU core
# (deploy/systemd/ilmildizi@.service is a template unit — enable ilmildizi@8001,
# ilmildizi@8002, ... one per port listed here) and let Nginx round-robin across them.
# `ip_hash` keeps each client's WebSocket connection pinned to the same instance for the
# life of that connection (a Battle Arena reconnect landing on a different daphne process
# mid-match would otherwise lose its in-memory connection state).
upstream ilmildizi_app {
    ip_hash;
    server 127.0.0.1:8001;
    server 127.0.0.1:8002;
    server 127.0.0.1:8003;
}

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # Payment screenshot uploads are capped at 5MB in Django (premium/views.py); a little
    # headroom here avoids Nginx rejecting a borderline-sized upload before Django even
    # gets to run its own validation.
    client_max_body_size 10M;

    location /static/ {
        alias /srv/ilmildizi/backend/staticfiles/;
        expires 30d;
        access_log off;
    }

    # Payment screenshots specifically must NOT be served as plain static files -- Django's
    # premium.views.payment_screenshot view gates access (owner/staff only) and re-derives
    # Content-Type from the actual file bytes (see that view's docstring for exactly why:
    # a stored-XSS finding from an earlier security review). This location is matched
    # before the general /media/ rule below, so it wins for this one subpath only.
    location /media/payment_screenshots/ {
        return 404;
    }

    # Everything else under /media/ (avatars, question/lesson images, CKEditor uploads) is
    # public by design -- served directly for speed, same as /static/.
    location /media/ {
        alias /srv/ilmildizi/backend/media/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://ilmildizi_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # WebSocket support (Battle Arena live PvP + matchmaking). $connection_upgrade
        # is defined once, above the server block — see the map directive at the top
        # of this file — since it needs to fall back to "close" for plain HTTP requests.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # WebSockets are long-lived — the default 60s proxy_read_timeout would silently
        # drop an idle-but-still-open battle/matchmaking connection.
        proxy_read_timeout 3600s;
    }
}
