# IlmIldizi — Docker uchun reverse proxy.
#
# Marshrutlash:
#   /api/, /telegram/, /ws/, /media/, /django-static/, /admin/  -> backend (daphne)
#   qolgan hamma narsa                                          -> frontend (Next.js)
#
# Ya'ni brauzer uchun hammasi BITTA domen: CORS ham, alohida API subdomeni ham kerak
# emas, Telegram Mini App esa faqat shu domenni biladi.
#
# TLS: bu fayl HTTP (80) bilan ishlashga tayyor. Sertifikat olingandan keyin pastdagi
# 443 blokini oching (izohdan chiqaring) va HTTP blokidagi `return 301` ni yoqing.
#
# Ikkita o'zgaruvchi bor, chunki ular bir xil emas:
#   SERVER_NAME — nginx javob beradigan domen(lar). Bir nechtasi bo'lishi mumkin:
#                 "ilmildizi.uz www.ilmildizi.uz".
#   CERT_NAME   — /etc/letsencrypt/live/ ichidagi papka nomi. Certbot uni birinchi -d
#                 argumentidan yasaydi, ya'ni HAR DOIM bitta nom.
# Ikkalasiga bitta o'zgaruvchi ishlatilsa, www qo'shilishi bilan nginx
# "/etc/letsencrypt/live/ilmildizi.uz www.ilmildizi.uz/fullchain.pem" ni qidiradi va
# ishga tushmaydi.

# WebSocket uchun standart idioma: brauzer "Upgrade: websocket" yuboradi, oddiy HTTP
# so'rovlar esa "Connection: close" bilan ketishi kerak. Qattiq yozib qo'yilgan
# "Connection: upgrade" oddiy sahifa yuklanishini buzadi.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream backend  { server web:8000; }
upstream frontend { server frontend:3000; }

server {
    listen 80;
    server_name ${SERVER_NAME};

    # Certbot HTTP-01 tekshiruvi. Sertifikat olinganidan keyin ham ochiq qolishi kerak:
    # yangilash (renew) xuddi shu yo'l orqali ishlaydi.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # --- Sertifikat olingandan KEYIN quyidagi qatorni yoqing --------------------
    # return 301 https://$host$request_uri;

    include /etc/nginx/conf.d/app_routes.inc;
}

