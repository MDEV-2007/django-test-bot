# Backend test suite, frontend build + typecheck, dependency and image hygiene checks.
# A red check means "do not deploy this commit".
name: CI

on:
  push:
    branches: [main]
  # Every PR (not only PRs into main), so feature/fix branches are checked before merge.
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      # Tests run on SQLite and the local-memory cache, same as local development.
      DEBUG: 'True'
      SECRET_KEY: ci-only-not-a-real-secret
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - name: Install dependencies
        run: pip install -r requirements/dev.txt
      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Run tests
        run: python manage.py test --noinput --parallel 2
      - name: Known-vulnerable Python dependencies
        run: |
          pip install pip-audit
          pip-audit -r requirements/prod.txt

  frontend:
    name: Frontend build and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Build first: it generates the route types (LayoutProps, PageProps) that tsc needs.
      - name: Production build
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      # Critical advisories in runtime dependencies block the merge (audit PROD-001).
      - name: Known-vulnerable npm dependencies
        run: npm audit --omit=dev --audit-level=critical

  image-hygiene:
    name: Docker build context has no secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Plant the files that must never reach the image, then export what `COPY backend/`
      # would see (audit PROD-002).
      - name: Probe the web image build context
        run: |
          echo 'SECRET=x' > backend/.env
          echo 'x' > backend/db.sqlite3
          mkdir -p backend/media/payment_screenshots && echo 'x' > backend/media/payment_screenshots/a.png
          printf 'FROM scratch\nCOPY backend/ /app/\n' > /tmp/Probe.Dockerfile
          docker build -q -f /tmp/Probe.Dockerfile --output type=local,dest=/tmp/ctx .
          if ls -a /tmp/ctx/app | grep -qxE '\.env|db\.sqlite3|media'; then
            echo "Secrets or local data leak into the image:"; ls -a /tmp/ctx/app; exit 1
          fi
