<svg width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>IlmIldizi splash screen</title>
  <desc>IlmIldizi ta'lim ilovasi uchun mobil splash ekrani</desc>
  <defs>
    <radialGradient id="glowTop" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2d6cff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2d6cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="iconGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2d6cff" stop-opacity="0.5"/>
      <stop offset="0.6" stop-color="#2d6cff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#2d6cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="iconGrad" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#4ea9ff"/>
      <stop offset="0.55" stop-color="#2f74f2"/>
      <stop offset="1" stop-color="#1c50cf"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2d6cff"/>
      <stop offset="1" stop-color="#37b7ff"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1080" height="1920" fill="#050811"/>
  <ellipse cx="540" cy="200" rx="720" ry="540" fill="url(#glowTop)"/>

  <g fill="#ffffff">
    <circle cx="180" cy="260" r="3" opacity="0.18"/>
    <circle cx="880" cy="180" r="4" opacity="0.14"/>
    <circle cx="920" cy="420" r="2.5" opacity="0.2"/>
    <circle cx="140" cy="520" r="2.5" opacity="0.16"/>
    <circle cx="260" cy="1120" r="3" opacity="0.12"/>
    <circle cx="840" cy="1180" r="3.5" opacity="0.13"/>
    <circle cx="960" cy="980" r="2.5" opacity="0.15"/>
    <circle cx="120" cy="980" r="3" opacity="0.12"/>
    <circle cx="700" cy="1500" r="2.5" opacity="0.12"/>
    <circle cx="380" cy="1560" r="3" opacity="0.1"/>
  </g>

  <circle cx="540" cy="610" r="320" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1.5"/>
  <circle cx="540" cy="610" r="255" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1.5"/>
  <ellipse cx="540" cy="620" rx="360" ry="360" fill="url(#iconGlow)"/>

  <!-- Icon: rounded square + stem/roots motif (same geometry as static/img/icon.png) -->
  <g transform="translate(350, 420)">
    <rect x="0" y="0" width="380" height="380" rx="94" fill="url(#iconGrad)"/>
    <rect x="0" y="0" width="380" height="380" rx="94" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>
    <!-- stem -->
    <rect x="166" y="91" width="47" height="167" rx="23.5" fill="#ffffff"/>
    <!-- roots, each rotated around its own top-center -->
    <rect x="149" y="198" width="41" height="129" rx="20.5" fill="#ffffff" transform="rotate(-34, 169.5, 198)"/>
    <rect x="190" y="198" width="41" height="129" rx="20.5" fill="#ffffff" transform="rotate(34, 210.5, 198)"/>
    <rect x="158" y="213" width="32" height="91" rx="16" fill="#ffffff" opacity="0.7" transform="rotate(-58, 174, 213)"/>
    <rect x="190" y="213" width="32" height="91" rx="16" fill="#ffffff" opacity="0.7" transform="rotate(58, 206, 213)"/>
  </g>

  <text x="540" y="1000" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="112" letter-spacing="-3">
    <tspan fill="#ffffff">Ilm</tspan><tspan fill="#37b7ff">Ildizi</tspan>
  </text>
  <text x="540" y="1068" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-weight="500" font-size="38" fill="#8ea3c4">Bilim sayohati</text>

  <rect x="390" y="1662" width="300" height="10" rx="5" fill="#ffffff" fill-opacity="0.08"/>
  <rect x="390" y="1662" width="132" height="10" rx="5" fill="url(#barGrad)"/>
  <text x="540" y="1724" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-weight="400" font-size="30" fill="#5b6b86">yuklanmoqda...</text>

  <text x="540" y="1858" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-weight="500" font-size="28" fill="#3f4b63" letter-spacing="1">IlmIldizi © 2026</text>
</svg>
